spring:
  datasource:
    url: jdbc:h2:mem:yebija;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: simple

jwt:
  secret: test-secret-key-must-be-at-least-32-characters-long
  access-expiration: 1800000
  refresh-expiration: 604800000
